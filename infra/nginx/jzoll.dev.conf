# jzoll.dev — root static site
# Served directly by nginx (no PM2 process needed — it's static files).
#
# SSL note: Cloudflare terminates TLS at the edge. This origin cert is what
# encrypts the Cloudflare -> EC2 hop (SSL mode = Full or Full (strict) in
# Cloudflare). Options:
#   A) Cloudflare Origin CA cert (free, 15-yr, only trusted by Cloudflare) — recommended
#   B) Let's Encrypt via certbot (works, but Cloudflare must proxy for HTTPS
#      to actually be end-to-end; certbot's HTTP-01 challenge needs port 80
#      reachable — fine either way since Cloudflare proxies it)
# This file assumes option A. Swap paths if using certbot.

server {
    listen 80;
    listen [::]:80;
    server_name jzoll.dev www.jzoll.dev;

    # Redirect all HTTP to HTTPS. Cloudflare also offers an "Always Use HTTPS"
    # rule at the edge — keep both; this is the origin-side backstop.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jzoll.dev www.jzoll.dev;

    ssl_certificate     /etc/nginx/ssl/jzoll.dev/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/jzoll.dev/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/jzoll-portfolio/apps/site;
    index index.html;

    # Static assets — long cache since filenames don't have cache-busting hashes yet.
    # Revisit if/when a build step with content hashing is introduced.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Restore the real client IP — required because Cloudflare proxies the
    # request, so without this every request in nginx's logs shows a
    # Cloudflare IP instead of the visitor's.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    access_log /var/log/nginx/jzoll.dev.access.log;
    error_log  /var/log/nginx/jzoll.dev.error.log;
}
